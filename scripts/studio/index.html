<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章工坊</title>
    <link rel="stylesheet" href="/studio.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="face" aria-hidden="true"></span>
        <div>
          <p class="kicker">本机 · 不会上线</p>
          <h1>文章工坊</h1>
        </div>
      </div>
      <a class="ghost" data-open-site href="http://127.0.0.1:3100/" target="_blank" rel="noreferrer">打开站点</a>
    </header>

    <main class="layout">
      <aside class="side">
        <button type="button" class="new" id="new-btn">+ 新建文章</button>
        <p class="hint">点保存就会写入仓库里的 Markdown、封面和相册。</p>
        <ul id="article-list" class="list"></ul>
      </aside>

      <section class="editor">
        <form id="form">
          <div class="row">
            <label>
              标题
              <input id="title" name="title" required placeholder="青岛" />
            </label>
            <label>
              slug
              <input id="slug" name="slug" required placeholder="qingdao-2026" autocomplete="off" />
            </label>
          </div>
          <div class="row three">
            <label>
              分类
              <select id="category">
                <option>摄影</option>
                <option>生活</option>
                <option>主题</option>
              </select>
            </label>
            <label>
              日期
              <input id="date" type="date" required />
            </label>
            <label class="check">
              <input id="allow-empty" type="checkbox" />
              暂时没有图
            </label>
          </div>
          <label>
            摘要
            <input id="summary" required placeholder="列表上的一两句" />
          </label>

          <div class="media">
            <div>
              <p class="label">封面</p>
              <label class="drop" id="cover-drop">
                <input id="cover-input" type="file" accept="image/*" hidden />
                <img id="cover-preview" alt="" hidden />
                <span id="cover-copy">拖进来，或点击选择</span>
              </label>
            </div>
            <div>
              <p class="label">相册（会按顺序写进正文）</p>
              <label class="drop" id="gallery-drop">
                <input id="gallery-input" type="file" accept="image/*" multiple hidden />
                <span>拖多张进来，或点击选择</span>
              </label>
              <ul id="gallery-list" class="thumbs"></ul>
            </div>
          </div>

          <div class="body-block">
            <div class="body-head">
              <span class="label">正文</span>
              <div class="toolbar" role="toolbar" aria-label="正文格式">
                <button type="button" data-cmd="bold" title="加粗 Ctrl+B">加粗</button>
                <button type="button" data-cmd="italic" title="斜体 Ctrl+I">斜体</button>
                <button type="button" data-cmd="h2" title="二级标题">标题</button>
                <button type="button" data-cmd="h3" title="三级标题">小标题</button>
                <button type="button" data-cmd="quote" title="引用">引用</button>
                <button type="button" data-cmd="list" title="列表">列表</button>
                <button type="button" data-cmd="image" title="在光标处插入图片">图片</button>
              </div>
            </div>
            <input id="inline-image-input" type="file" accept="image/*" multiple hidden />
            <div class="split">
              <div class="pane">
                <p class="pane-label">原文</p>
                <textarea
                  id="body"
                  rows="16"
                  placeholder="左边写 Markdown，右边看效果。也可用上面的按钮。"
                ></textarea>
              </div>
              <div class="pane">
                <p class="pane-label">预览</p>
                <div id="preview" class="preview"></div>
              </div>
            </div>
          </div>

          <p id="status" class="status" role="status"></p>

          <div class="actions">
            <button type="submit" class="save" id="save-btn">保存到仓库</button>
            <button type="button" class="danger" id="delete-btn" hidden>删除</button>
            <a id="preview-link" class="ghost" hidden target="_blank" rel="noreferrer">打开预览</a>
          </div>
          <p class="footnote">
            保存后文件已在本地。要发布：提交 git，再部署。工坊只监听 127.0.0.1，不会出现在线上站点。
          </p>
        </form>
      </section>
    </main>
    <script src="/studio.js" type="module"></script>
  </body>
</html>
